services:
  - type: web
    name: the-new-world-pieck-bot
    runtime: node
    plan: free
    buildCommand: npm install --include=dev && npm run build && mkdir -p bin && curl -sL https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp_linux -o bin/yt-dlp && chmod +x bin/yt-dlp
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22.22.0
      - key: GROQ_API_KEY
        sync: false
      - key: YTDLP_PATH
        value: ./bin/yt-dlp
      - key: DATA_DIR
        value: ./data

      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
